<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API keys · Hermes</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --mut:#666; --line:#dcdcdc; --card:#f7f7f8; --acc:#2563eb; --ok:#15803d; --bad:#b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161616; --fg:#ececec; --mut:#9a9a9a; --line:#333; --card:#1f1f1f; --acc:#60a5fa; --ok:#4ade80; --bad:#f87171; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 0 0 4px; }
  p { margin: 6px 0; }
  .mut { color: var(--mut); font-size: .92rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin: 14px 0; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  input[type=password], input[type=text], select { flex:1 1 220px; min-width:0; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); font:inherit; }
  button { padding:9px 14px; border:0; border-radius:8px; background:var(--acc); color:#fff; font:inherit; cursor:pointer; }
  button.sec { background:transparent; color:var(--acc); border:1px solid var(--acc); }
  button:disabled { opacity:.55; cursor:default; }
  a { color:var(--acc); }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  .msg { margin-top:10px; padding:9px 11px; border-radius:8px; border:1px solid var(--line); white-space:pre-wrap; }
  .msg.ok { border-color:var(--ok); } .msg.bad { border-color:var(--bad); }
  .tag { display:inline-block; font-size:.78rem; padding:1px 8px; border-radius:99px; border:1px solid var(--line); margin-left:6px; color:var(--mut); }
  .top { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .get { flex:0 0 auto; padding:9px 12px; border:1px solid var(--acc); border-radius:8px; text-decoration:none; white-space:nowrap; }
  .welcome { border-color:var(--acc); }
  .welcome ol { margin:6px 0 0 18px; padding:0; }
  .warn { border-left:3px solid var(--bad); padding-left:9px; }
  .side { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .langs { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .langs button { background:transparent; color:var(--mut); border:0; border-radius:0; padding:5px 10px; font-size:.85rem; }
  .langs button + button { border-left:1px solid var(--line); }
  .langs button[aria-pressed=true] { background:var(--acc); color:#fff; }
</style>
</head>
<body>
<main>
  <div class="top">
    <div><h1 data-i18n="title"></h1><p class="mut" data-i18n="subtitle"></p></div>
    <div class="side">
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-l="en" aria-pressed="false">en</button><button type="button" data-l="ru" aria-pressed="false">ru</button><button type="button" data-l="es" aria-pressed="false">es</button>
      </div>
      <a href="/" data-i18n="back"></a>
    </div>
  </div>
  <div class="card welcome">
    <h2 data-i18n="howTitle"></h2>
    <ol>
      <li data-i18n-html="how1"></li>
      <li data-i18n-html="how2"></li>
      <li data-i18n-html="how3"></li>
    </ol>
    <p class="mut" data-i18n="howNote"></p>
  </div>
  <div class="card" id="active"><p class="mut" data-i18n="loading"></p></div>
  <div id="telegram"></div>
  <h1 style="margin-top:28px" data-i18n="recommended"></h1>
  <div id="ai-extra"></div>
  <h1 style="margin-top:28px" data-i18n="moreProviders"></h1>
  <p class="mut" data-i18n="moreNote"></p>
  <div id="providers"></div>

  <h1 style="margin-top:32px" data-i18n="servicesTitle"></h1>
  <p class="mut" data-i18n="servicesNote"></p>
  <div id="services"></div>

  <p class="mut" data-i18n="footer"></p>
</main>
<script>const SERVER_LANG = "__SERVER_LANG__";</script>

    change: 'Cambiar de modelo',
    costOr: 'hasta 3 pedidos de prueba (los modelos gratuitos de OpenRouter comparten un tope de unos 50 por día)', costOther: 'hasta 16 pedidos de prueba de tu cuota',

};
const pickLang = () => {
  try { const s = localStorage.getItem('keys-lang'); if (LANGS.includes(s)) return s; } catch (e) {}
  if (LANGS.includes(SERVER_LANG)) return SERVER_LANG;
  const nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
  return LANGS.includes(nav) ? nav : 'en';
};
let LANG = pickLang();
const t = (k, v) => (I18N[LANG][k] ?? I18N.en[k] ?? k).replace(/\{(\w+)\}/g, (m, n) => (v && n in v ? v[n] : m));
function applyStatic() {
  document.documentElement.lang = LANG;
  document.title = t('pageTitle');
  document.querySelectorAll('[data-i18n]').forEach(n => { n.textContent = t(n.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(n => { n.innerHTML = t(n.dataset.i18nHtml); });   // our own constants, never server text
  document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.l === LANG)));
}
function setLang(l) {
  if (!LANGS.includes(l) || l === LANG) return;
  LANG = l;
  try { localStorage.setItem('keys-lang', l); } catch (e) {}
  applyStatic(); loadAll();
}

const api = async (path, body) => {
  let r;
  const headers = {'X-Keys-Lang': LANG};
  try { r = await fetch('/keys/api/' + path, body ? {method:'POST', headers:{...headers, 'Content-Type':'application/json','X-Keys':'1'}, body:JSON.stringify(body)} : {headers}); }
  catch(e) { return {ok:false, error:t('noConnect')}; }
  let j = null; try { j = await r.json(); } catch(e) {}
  const err = j && typeof j.error === 'string' ? j.error : '';
  if (r.status === 401) return {ok:false, error:t('sessionExpired')};
  if (r.status === 403) return {ok:false, error: err || t('adminOnly')};
  if (err === 'asleep' || (r.status === 503 && !j)) return {ok:false, error:t('asleep')};
  if (r.status === 504) return {ok:false, error:t('timeout')};
  if (r.status >= 500 || j === null) return {ok:false, error:t('badAnswer', {n:r.status})};
  return j;
};
function say(box, text, ok) { box.className = 'msg ' + (ok ? 'ok' : 'bad'); box.textContent = text; }

async function load() {
  const lang0 = LANG;
  const st = await api('status');
  if (lang0 !== LANG) return;   // the language was switched meanwhile: the newer load draws
  const act = $('#active'); act.replaceChildren();
  if (!st.providers) { act.append(el('p', {className:'bad', textContent: st.error || t('noState')})); return; }
  const a = st.active || {};
  act.append(el('h2', {textContent:t('modelInUse')}),
    el('p', {textContent: a.provider ? t('modelLine', {m:a.default, p:a.provider}) : t('noModel')}));
  const host = $('#providers'); host.replaceChildren();
  st.providers.forEach(p => host.append(card(p, a)));
}

function card(p, active) {
  const c = el('div', {className:'card'});
  const web = p.credentials.filter(x => x.from_web);
  const v = p.validated;
  // p.credentials holds only keys with a real value (the server drops an empty environment variable); "validated" shows only
  // the last 4 of a key this page really checked
  const status = p.credentials.length
    ? el('span', {className:'ok', textContent: t('withKey') + (v && web.length ? t('validated', {x:v.last4}) : '')})
    : el('span', {className:'mut', textContent: t('noKey')});
  const head = el('h2', {}, p.label, status);
  if (active.provider === p.id) head.append(el('span', {className:'tag', textContent:t('inUse')}));
  c.append(head, el('p', {className:'mut', textContent:p.note}));
  const link = el('a', {href:p.link, target:'_blank', rel:'noopener noreferrer', className:'get', textContent:t('getKey')});
  const key = el('input', {type:'password', placeholder:t('pasteHint', {h:p.hint}), autocomplete:'off', spellcheck:false});
  const btn = el('button', {textContent:t('save')});
  const box = el('div', {className:'msg', hidden:true});
  const modelRow = el('div', {className:'row', hidden:true});
  c.append(el('div', {className:'row'}, link, key, btn), box, modelRow);
  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = t('validating'); box.hidden = false; box.className = 'msg'; box.textContent = t('checking');
    let r;
    try { r = await api('save', {provider:p.id, key:key.value}); }
    finally { btn.disabled = false; btn.textContent = t('save'); }
    say(box, r.ok ? r.message : (r.error || t('notSaved')), !!r.ok);
    if (r.ok) { key.value = ''; setTimeout(load, 800); }
    // the key stays in the input after a failure: the picker re-sends it together with the chosen model
    if (!r.ok && r.models && r.models.length) pickModel(modelRow, p, r.models, r.model, key);
  };
  web.forEach(w => {
    const tail = [v && v.last4 ? '…' + v.last4 : '', w.date].filter(Boolean).join(', ');
    const rm = el('button', {className:'sec', textContent:t('removeHere') + (tail ? ' (' + tail + ')' : '')});
    rm.onclick = async () => { if (!confirm(t('confirmRemove'))) return; rm.disabled = true; let r; try { r = await api('remove', {provider:p.id, id:w.id}); } finally { rm.disabled = false; } say(box, r.message || r.error, !!r.ok); box.hidden = false; setTimeout(load, 800); };
    c.append(el('div', {className:'row'}, rm));
  });
  if (web.length) {
    const chg = el('button', {className:'sec', textContent:t('change')});
    const cost = p.id === 'openrouter' ? t('costOr') : t('costOther');
    chg.onclick = async () => {
      if (!confirm(t('confirmProbe', {c:cost}))) return;
      chg.disabled = true; box.hidden = false; box.className = 'msg'; box.textContent = t('searching');
      let r; try { r = await api('probe/' + p.id, {}); } finally { chg.disabled = false; }
      if (r.verified && r.verified.length) { box.hidden = true; pickModel(modelRow, p, r.verified, active.provider === p.id ? active.default : null); }
      else say(box, r.error || t('noneResponded'), false);
    };
    c.append(el('div', {className:'row'}, chg));
  }
  return c;
}

function pickModel(row, p, models, current, keyInput) {
  row.hidden = false; row.replaceChildren();
  const sel = el('select');
  models.forEach(m => sel.append(el('option', {value:m, textContent:m, selected: m === current})));
  const go = el('button', {textContent:t('useModel')});
  const out = el('div', {className:'msg', hidden:true});
  go.onclick = async () => {
    go.disabled = true; out.hidden = false; out.className = 'msg'; out.textContent = t('testingModel');
    // keyInput is set only after a failed save: the key is still pasted, so save it together with this model
    const pending = keyInput && keyInput.value.trim();
    let r;
    try { r = pending ? await api('save', {provider:p.id, key:keyInput.value, model:sel.value}) : await api('use', {provider:p.id, model:sel.value}); }
    finally { go.disabled = false; }
    say(out, r.message || r.error || t('modelFail'), !!r.ok);
    if (r.ok) { if (pending) keyInput.value = ''; setTimeout(load, 800); }
  };
  row.append(sel, go, out);
  out.style.flexBasis = '100%';
}
async function loadServices() {
  const lang0 = LANG;
  const host = $('#services'), ai = $('#ai-extra');
  const st = await api('services?lang=' + LANG);   // the service texts (and Token Harbor's data-use warning) come in the page's language
  if (lang0 !== LANG) return;
  host.replaceChildren(); ai.replaceChildren();
  if (!st.services) { host.append(el('p', {className:'bad', textContent: st.error || t('noServices')})); return; }
  st.services.forEach(sv => {
    const c = el('div', {className:'card'});
    const status = sv.via_operator ? el('span', {className:'ok', textContent:t('byAdmin')}) : sv.last4 ? el('span', {className:'ok', textContent:t('withYourKey', {x:sv.last4})}) : el('span', {className:'mut', textContent:t('noKey')});
    c.append(el('h2', {}, sv.label, status),
      el('p', {textContent:t('svcWith') + sv.gives + '.'}),
      el('p', {className:'mut', textContent:t('svcWithout') + sv.without + '.'}),
      el('p', {className:'mut', textContent:t('svcHow') + sv.how + '.'}));
    if (sv.note) c.append(el('p', {className:'warn', textContent:sv.note}));
    const link = el('a', {href:sv.link, target:'_blank', rel:'noopener noreferrer', className:'get', textContent:t('getKey')});
    const key = el('input', {type:'password', placeholder: sv.placeholder || t('pasteHere'), autocomplete:'off', spellcheck:false});
    const btn = el('button', {textContent:t('save')});
    const box = el('div', {className:'msg', hidden:true});
    c.append(el('div', {className:'row'}, link, key, btn), box);
    btn.onclick = async () => {
      btn.disabled = true; box.hidden = false; box.className = 'msg'; box.textContent = t('checkingSvc');
      let r; try { r = await api('service_save', {service:sv.id, key:key.value}); } finally { btn.disabled = false; }
      say(box, r.ok ? r.message : (r.error || t('notSaved')), !!r.ok);
      if (r.ok) { key.value = ''; setTimeout(loadServices, 800); }
    };
    if (sv.last4 && !sv.via_operator) {
      const rm = el('button', {className:'sec', textContent:t('removeMine')});
      rm.onclick = async () => { if (!confirm(t('confirmSvc'))) return; rm.disabled = true;
        let r; try { r = await api('service_remove', {service:sv.id}); } finally { rm.disabled = false; }
        say(box, r.message || r.error, !!r.ok); box.hidden = false; setTimeout(loadServices, 800); };
      c.append(el('div', {className:'row'}, rm));
    }
    (sv.kind === 'ia' ? ai : host).append(c);
  });
}
async function loadTelegram() {
  const lang0 = LANG;
  const host = $('#telegram');
  const r = await api('telegram?lang=' + LANG);
  if (lang0 !== LANG) return;
  host.replaceChildren();
  if (!r.telegram) return;   // older image without the endpoint: show nothing rather than an error
  const tg = r.telegram;
  const c = el('div', {className:'card'});
  const status = tg.connected
    ? el('span', {className:'ok', textContent:' ✔ ' + tg.on + (tg.bot ? ' (@' + tg.bot + ')' : '')})
    : el('span', {className:'mut', textContent:' ' + tg.off});
  c.append(el('h2', {}, tg.label, status), el('p', {textContent:tg.how}));
  const box = el('div', {className:'msg', hidden:true});
  if (tg.is_managed) { c.append(el('p', {className:'mut', textContent:tg.managed})); host.append(c); return; }
  if (!tg.connected) {
    const ol = el('ol', {className:'mut'}); tg.steps.forEach(x => ol.append(el('li', {textContent:x}))); ol.style.margin = '6px 0 0 18px'; ol.style.padding = '0';
    const tok = el('input', {type:'password', placeholder:tg.token, autocomplete:'off', spellcheck:false});
    const uid = el('input', {type:'text', placeholder:tg.uid, autocomplete:'off', spellcheck:false, inputMode:'numeric'});
    const btn = el('button', {textContent:t('tgSave')});
    const link = el('a', {href:tg.link, target:'_blank', rel:'noopener noreferrer', className:'get', textContent:tg.linktext});
    c.append(ol, el('div', {className:'row'}, link), el('div', {className:'row'}, tok, uid, btn), box);
    btn.onclick = async () => {
      btn.disabled = true; box.hidden = false; box.className = 'msg'; box.textContent = '…';
      let x; try { x = await api('telegram_save', {token:tok.value, uid:uid.value}); } finally { btn.disabled = false; }
      say(box, x.ok ? x.message : (x.error || t('error')), !!x.ok);
      if (x.ok) { tok.value = ''; uid.value = ''; setTimeout(loadTelegram, 1500); }
    };
  } else {
    const rm = el('button', {className:'sec', textContent:t('tgRm')});
    rm.onclick = async () => { if (!confirm(t('tgAsk'))) return; rm.disabled = true;
      let x; try { x = await api('telegram_remove', {}); } finally { rm.disabled = false; }
      say(box, x.message || x.error, !!x.ok); box.hidden = false; setTimeout(loadTelegram, 1500); };
    c.append(el('div', {className:'row'}, rm), box);
  }
  host.append(c);
}
function loadAll() { load(); loadServices(); loadTelegram(); }
document.querySelectorAll('.langs button').forEach(b => { b.onclick = () => setLang(b.dataset.l); });
applyStatic();
loadAll();
</script>
