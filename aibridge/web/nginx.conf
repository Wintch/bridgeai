# Front door for the web UI (2026-10-04): one origin, two jobs.
#   /                -> Open WebUI (chat UI with login), websockets + long timeouts
#   /hermes-files/   -> files Hermes produced for the web user, served ONLY to a logged-in
#                       Open WebUI session (auth_request against Open WebUI's own API, using the
#                       same `token` cookie the browser already has). Same origin => markdown links
#                       and inline images in the chat just work, no second login.
# Published on VM105's LAN IP; the firewall (docker-user-fw.sh) allows the LAN and the edge VM, which exposes it to
# the internet as https://<hernik-domain>.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Only known-harmless media/document types are shown inline; EVERYTHING else (HTML, SHTML, SVG, XML, JS, unknown
# extensions...) is forced to download: it would otherwise run on the same origin as Open WebUI, whose JWT sits in
# localStorage. Hermes writes these files and can be talked into producing hostile ones.
map $uri $files_disposition {
    ~*\.(png|jpe?g|gif|webp|avif|mp4|webm|mov|mp3|m4a|wav|ogg|opus|flac|aac|pdf|txt|md|csv)$  inline;
    default                                                     attachment;
}

# Belt and braces: whatever is opened directly from /hermes-files/ is sandboxed (no scripts, unique origin). Not for
# PDFs: Chrome's PDF viewer refuses to render a document served with `sandbox`. An empty value adds no header.
map $uri $files_csp {
    ~*\.pdf$  "";
    default   "sandbox";
}

# Rate limit for the wake endpoints (/__wake/status is polled by every open "loading" page, and each anonymous
# navigation to a sleeping stack lands in @wake). Key = the real client: the edge VM sets X-Forwarded-For to the
# client address it saw (it overwrites, it does not append), so use that; a direct LAN visitor has none and is
# keyed by its own address. A LAN client could only vary its own key, which the firewall already limits to the LAN.
map $http_x_forwarded_for $wake_client {
    default  $http_x_forwarded_for;
    ""       $remote_addr;
}
limit_req_zone $wake_client zone=wake:2m rate=5r/s;

server {
    listen 8080;
    server_name _;

    # Re-resolve `open-webui` (docker's embedded DNS) instead of caching its IP at startup: the
    # container gets a new IP whenever it is recreated, which would otherwise break this proxy
    # until nginx is restarted. Using variables in proxy_pass is what makes nginx re-resolve.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $owui http://open-webui:8080;
    set $owui_auth http://open-webui:8080/api/v1/auths/;

    # Uploads of videos/PDFs go through here; stream them instead of buffering to disk first.
    client_max_body_size 2g;

    # Now reachable from the internet via the edge VM (https://<hernik-domain>), which sends none of these.
    # (HSTS is ignored by browsers when the page is loaded over plain http on the LAN, so it is safe here.)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    proxy_request_buffering off;

    location = /_auth {
        internal;
        proxy_pass $owui_auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }

    # Keys page (keys_server.py, inside the Hermes container): only for a logged-in Open WebUI session, and the
    # server itself additionally requires the Open WebUI ADMIN role. Absent on stacks without HERMES_KEYS_UI (502).
    location = /keys { return 301 /keys/; }
    location /keys/ {
        auth_request /_auth;
        # Open WebUI stopped => the auth subrequest fails with 500 (not 502): wake the stack like any other page.
        error_page 500 502 503 504 = @wake;
        set $keys http://hermes:8700;
        proxy_pass $keys;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;   # a key check + a model test can take a while
    }

    location /hermes-files/ {
        auth_request /_auth;
        alias /web-outputs/;
        autoindex off;
        default_type application/octet-stream;
        add_header Content-Disposition $files_disposition always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Cache-Control "private, no-store" always;
        add_header Content-Security-Policy $files_csp always;
    }

    # Wake-on-demand (ops/wake/waker.py): while Open WebUI is stopped nginx answers 502 and the waker shows a
    # "loading" page (only for a browser navigation) and starts the containers. /__wake/status is polled by that page.
    # The waker's address is per stack (its docker network gateway): /etc/nginx/wake/*.conf sets $waker. With no
    # file mounted the default points nowhere, so a stack without a waker just shows the plain 502 as before.
    set $waker http://127.0.0.1:1;
    include /etc/nginx/wake/*.conf;
    location /__wake/ {
        limit_req zone=wake burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $waker;
    }
    location @wake {
        limit_req zone=wake burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $waker;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering on;
    }

    location / {
        error_page 502 503 504 = @wake;
        proxy_pass $owui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # A Hermes turn that transcodes a video runs for many minutes.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
