# Main nginx config for the `web` container. Identical to the image default except `user root;`.
# Why: Hermes runs with umask 077 (deliberate, see start_hermes.sh), so the result files it drops in
# /web-outputs are 0600/0700 root:root and the default `nginx` worker user gets 403. The container
# only has /web-outputs mounted read-only (plus its config), so root here reads those files and
# can write nothing.
user  root;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
