# Zabbix agent UserParameters for the software inventory (vuln_watch). Read-only: the script needs no root and no network.
#
# Install on each monitored Debian-family host:
#   1. copy ops/zabbix/vw_inventory.sh to /etc/zabbix/vw_inventory.sh (mode 0755, owner root)
#   2. copy this file to /etc/zabbix/zabbix_agent2.d/ (Zabbix agent 2) or /etc/zabbix/zabbix_agentd.d/ (classic agent)
#   3. restart the agent (systemctl restart zabbix-agent2, or zabbix-agent)
#   4. test as the agent would run it:  zabbix_agent2 -t 'vw.apt'   and   zabbix_agent2 -t 'vw.dpkg[0,4]'
#      (classic agent: zabbix_agentd -t ...). A `vw.dpkg[N,4]` result starts with "#vw.dpkg shard=N of=4 count=...".
#
# vw.dpkg[N,M]  shard N of M of the installed packages, one TSV line per binary package (about 40 KB for N of 4 on a
#               desktop with 3000+ packages; the template reads shards 0..3 of 4)
# vw.apt        compact JSON: pending and security updates, reboot required, apt lists age, running and installed kernel
#
# These items return several KB of text and the dpkg/apt calls can take a few seconds on a slow disk, so the Zabbix 7.0
# template sets the item timeout to 30s per item (Item > Timeout). Do not rely on the agent-wide Timeout for them.
UserParameter=vw.dpkg[*],/etc/zabbix/vw_inventory.sh dpkg $1 $2
UserParameter=vw.apt,/etc/zabbix/vw_inventory.sh apt
