      macros:
        - macro: '{$PROV.PROBE.FAILS}'
          value: '3'
          description: 'Probes in a row that must fail before the provider is down.'
        - macro: '{$PROV.CHAT.FAILS}'
          value: '2'
          description: 'Chat probes in a row that must fail (only providers with PROBE_CHAT_<PROVIDER> set).'
        - macro: '{$PROV.AVAIL.MIN}'
          value: '50'
          description: 'Percent of real calls that must answer over 10 min, below this the provider is down (needs {$PROV.MIN.CALLS} calls).'
        - macro: '{$PROV.MIN.CALLS}'
          value: '5'
          description: 'Calls in 10 min below which the real traffic says nothing.'
        - macro: '{$PROV.TTFB.P95.MAX}'
          value: '15'
          description: 'Seconds to the first byte, p95 over 10 min, above which the provider is degraded.'
        - macro: '{$PROV.PROBE.MS.MAX}'
          value: '5000'
          description: 'Milliseconds; the last 3 probes all slower than this make the provider degraded.'
        - macro: '{$PROV.429.PCT}'
          value: '50'
          description: 'Percent of calls answered 429 over 10 min that is a storm (needs {$PROV.MIN.CALLS.429} calls).'
        - macro: '{$PROV.MIN.CALLS.429}'
          value: '10'
          description: 'Calls in 10 min below which a 429 share says nothing.'
        - macro: '{$PROV.NODATA}'
          value: '20m'
          description: 'How long the collector may stay silent before its own alert.'
        - macro: '{$PROV.TRAPPER.HOSTS}'
          value: '127.0.0.1'
          description: 'Allowed hosts of every trapper item: the Docker host''s address (provision.py provider-hosts --sender-addr sets it per host).'
