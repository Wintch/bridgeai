zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 86b82a593b7e4456bbefc01de8fb67e3
      name: 'Templates/bridgeai'
  templates:
    - uuid: 6bb4090a421f40ef859a913ce1cac7ad
      template: 'Cloud provider uptime'
      name: 'Cloud provider uptime'
      description: |
        Cloud model provider uptime as seen from our own VM: real calls of the stacks plus our own probes.
        Trapper items, pushed every 5 minutes by ops/provider_uptime.py (built-in trapper protocol or zabbix_sender).
        One host per provider, named provider-<name> (ops/zabbix/provision.py provider-hosts). Generated by
        `python3 ops/provider_uptime.py template`: edit the generator, not this file.
      groups:
        - name: 'Templates/bridgeai'
      items:
        - uuid: 33f1a65952bd4a25adf7cd8ba7a469dc
          name: 'Collector heartbeat'
          type: TRAP
          key: 'provider.heartbeat'
          delay: '0'
          history: 30d
          trends: 365d
          value_type: UNSIGNED
          units: 'unixtime'
          description: 'Time of the last run of ops/provider_uptime.py; silence raises its own problem.'
          allowed_hosts: '{$PROV.TRAPPER.HOSTS}'
          tags:
            - tag: component
              value: provider-uptime
          triggers:
            - uuid: a2bf4add04ac4a05b37f941f6b29527d
              expression: 'nodata(/Cloud provider uptime/provider.heartbeat,{$PROV.NODATA})=1'
              name: 'Provider uptime collector not reporting'
              priority: AVERAGE
              description: 'Nothing arrived for this provider for {$PROV.NODATA}: the timer, the VM or the push is down. Without it no provider outage can be seen.'
              manual_close: 'YES'
              tags:
                - tag: tier
                  value: normal
        - uuid: 34a1605fe7bd48a39be1c3ebb5ac21f8
          name: 'Provider state (0 up, 1 degraded, 2 down)'
          type: TRAP
          key: 'provider.state'
          delay: '0'
          history: 30d
          trends: 365d
          value_type: UNSIGNED
          description: 'The collector''s own verdict, same rules as the triggers; kept for graphs and for the monthly report.'
          allowed_hosts: '{$PROV.TRAPPER.HOSTS}'
          tags:
            - tag: component
              value: provider-uptime
        - uuid: e969e4fde34e4712b3d9470c840c41bf
          name: 'Probe: front end answered (1 yes, 0 no)'
          type: TRAP
          key: 'provider.probe.ok'
          delay: '0'
          history: 30d
          trends: 365d
          value_type: UNSIGNED
          description: 'Reach probe: GET <base>/models. Any HTTP answer below 500 is 1 (a 429 or a 401 is a live front end).'
          allowed_hosts: '{$PROV.TRAPPER.HOSTS}'
          tags:
            - tag: component
              value: provider-uptime
          triggers:
            - uuid: 1ecc644e6b954fd1b8d9d47727a978e7
              expression: 'count(/Cloud provider uptime/provider.probe.ok,#{$PROV.PROBE.FAILS},"eq",0)>={$PROV.PROBE.FAILS} or count(/Cloud provider uptime/provider.chat.ok,#{$PROV.CHAT.FAILS},"eq",0)>={$PROV.CHAT.FAILS} or (last(/Cloud provider uptime/provider.traffic.calls[10m])>={$PROV.MIN.CALLS} and last(/Cloud provider uptime/provider.traffic.avail[10m])>=0 and last(/Cloud provider uptime/provider.traffic.avail[10m])<{$PROV.AVAIL.MIN} and last(/Cloud provider uptime/provider.traffic.wide[10m])=1)'
              name: 'Cloud provider down'
              priority: HIGH
              description: 'Real traffic or our probes say the provider does not answer. Zabbix pages; the ops bot adds which stacks are hit and the steps to move them to the local LLM set (ops/provider_uptime.py fallback).'
              manual_close: 'YES'
              tags:
                - tag: tier
                  value: critical
        - uuid: f95ba877c9cc45b0864b72bae4dace96
          name: 'Probe: milliseconds'
          type: TRAP
          key: 'provider.probe.ms'
          delay: '0'
          history: 30d
          trends: 365d
          value_type: UNSIGNED
          units: 'ms'
          description: 'Time of the reach probe.'
          allowed_hosts: '{$PROV.TRAPPER.HOSTS}'
          tags:
            - tag: component
              value: provider-uptime
          triggers:
            - uuid: df270495440245b18df711a627b83fed
              expression: 'count(/Cloud provider uptime/provider.probe.ms,#3,"gt",{$PROV.PROBE.MS.MAX})>=3 or (last(/Cloud provider uptime/provider.traffic.calls[10m])>={$PROV.MIN.CALLS} and last(/Cloud provider uptime/provider.traffic.ttfb_p95[10m])>{$PROV.TTFB.P95.MAX}) or (last(/Cloud provider uptime/provider.traffic.calls[10m])>={$PROV.MIN.CALLS.429} and last(/Cloud provider uptime/provider.traffic.errors[10m,429])*100>={$PROV.429.PCT}*last(/Cloud provider uptime/provider.traffic.calls[10m]))'
              name: 'Cloud provider degraded'
              priority: AVERAGE
              description: 'Slow probes, slow first byte over 10 min, or a 429 storm. Not an outage: a 429 is also a person''s own allowance running out.'
              manual_close: 'YES'
              dependencies:
                - name: 'Cloud provider down'
                  expression: 'count(/Cloud provider uptime/provider.probe.ok,#{$PROV.PROBE.FAILS},"eq",0)>={$PROV.PROBE.FAILS} or count(/Cloud provider uptime/provider.chat.ok,#{$PROV.CHAT.FAILS},"eq",0)>={$PROV.CHAT.FAILS} or (last(/Cloud provider uptime/provider.traffic.calls[10m])>={$PROV.MIN.CALLS} and last(/Cloud provider uptime/provider.traffic.avail[10m])>=0 and last(/Cloud provider uptime/provider.traffic.avail[10m])<{$PROV.AVAIL.MIN} and last(/Cloud provider uptime/provider.traffic.wide[10m])=1)'
              tags:
                - tag: tier
                  value: normal
        - uuid: c4886de994254954a4a4cf7c9fcf1036
          name: 'Probe: HTTP code (0 = no answer)'
          type: TRAP
          key: 'provider.probe.code'
          delay: '0'
          history: 30d
          trends: 365d
          value_type: UNSIGNED
          description: 'Status of the reach probe.'
          allowed_hosts: '{$PROV.TRAPPER.HOSTS}'
          tags:
            - tag: component
              value: provider-uptime
        - uuid: 372a8dc592744668b1113fdc4351001b
