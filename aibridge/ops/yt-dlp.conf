# bridgeai default for every person (see HERMES_ARCHITECTURE.md, "yt-dlp").
# YouTube serves video and audio as separate streams, so "best[ext=mp4]" and "-f best" often find nothing usable.
# This picks the best video up to 720p with H.264 + AAC (plays in Telegram and browsers) and merges it into one mp4.
# node is the JavaScript runtime YouTube extraction needs. Any -f/-o on the command line still wins.
--js-runtimes node
-S res:720,vcodec:h264,acodec:m4a
-f bv*+ba/b
--merge-output-format mp4
--no-playlist
