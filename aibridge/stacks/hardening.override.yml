# Container-hardening profile for the per-person Hermes container, as a compose OVERRIDE (2026-11-03). It is used ONLY by
# ops/hardening_trial_stack.sh (a throwaway stack); stacks/docker-compose.stack.yml, and so every real person's stack, is
# untouched until the trial has run clean. At rollout this block is folded into the template (or added as a second -f in
# provision_stack.sh, recreate_hermes.sh and stack_voice.sh, which today name only the template).
# Same profile as guests/docker-compose.guest.yml (keep the two in step; ops/container_hardening.py checks a running
# container against it): no-new-privileges, at most 1024 tasks, cap_drop ALL + 7 capabilities added back. Why each, and what
# was left out on purpose (read-only rootfs, non-root user): see the note in guests/docker-compose.guest.yml and
# HERMES_ARCHITECTURE.md item 94.
services:
  hermes:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - KILL
      - NET_RAW
    deploy:
      resources:
        limits:
          pids: 1024
