# sites-web: static websites published by ops/sites_deploy.py. Runs as the image's unprivileged nginx user on a
# read-only root; everything it may write is tmpfs under /tmp. One server block per site, generated in /sites/_nginx.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types { application/manifest+json webmanifest; }
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    sendfile on;
    server_tokens off;
    client_max_body_size 1k;
    # The edge in front is the only client; it sends the visitor's address.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/manifest+json;

    server {
        listen 8080 default_server;
        return 404;
    }
    include /sites/_nginx/sites.conf;
}
