# GPU power limits (watts) the gate sets while a service runs, one section per GPU model.
# A section name is matched as a case-insensitive substring of `nvidia-smi --query-gpu=name`.
# Keys are service names (see gate/gate.py). Only measured values go here: a service without a value does not touch the
# limit, and an unknown GPU is left alone. While several services run, the highest value among them applies.
# When the last service stops the gate restores the limit it found before the first start.

[RTX 3060 Ti]
imggen = 130
vidgen = 130
llm = 130
vidpost = 100
transcoder = 100
upscaler = 100

[GTX 1070 Ti]
llm = 100
