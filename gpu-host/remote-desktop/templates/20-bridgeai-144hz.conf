# bridgeai: 1080p 144 Hz (and 120 Hz) for the dummy HDMI plug, which advertises only 1080p60. Without ModeValidation the NVIDIA driver refuses
# a mode that is not in the EDID. Undo: remove this file and restart lightdm.
# 144 Hz: reduced-blanking timings by hand (cvt -r wants a multiple of 60): 2080 x 1111 x 144 Hz = 332.77 MHz, under the 340 MHz HDMI 1.4 limit.
Section "Monitor"
    Identifier "Monitor0"
    Modeline "1920x1080_144" 332.77  1920 1968 2000 2080  1080 1083 1088 1111 +hsync -vsync
    Modeline "1920x1080_120" 285.25  1920 1968 2000 2080  1080 1083 1088 1144 +hsync -vsync
    Option "PreferredMode" "1920x1080_144"
EndSection

Section "Device"
    Identifier "Device0"
    Driver "nvidia"
    Option "Monitor-HDMI-0" "Monitor0"
    Option "ModeValidation" "HDMI-0: AllowNonEdidModes, NoEdidMaxPClkCheck, NoMaxPClkCheck, NoVertRefreshCheck, NoHorizSyncCheck"
EndSection
