# nginx site for the door (install-door.sh puts it in /etc/nginx/sites-enabled/bridgeai-door). TLS ends here; /_door/ is the door service on
# localhost; everything else goes, after an auth_request to the door, to the person's own place on the LAN, with the place's basic-auth header added
# by nginx (the browser never sees it). WebSockets (the desktop's stream) are proxied on the same path.
# Without a session the front page is only a plain welcome with no links: the login is reached by knowing /_door (one more layer against bots,
# not a secret that protects anything by itself).
map $http_upgrade $door_conn { default upgrade; "" close; }

server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/bridgeai-door/tls/fullchain.pem;
    ssl_certificate_key /etc/bridgeai-door/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 64m;
    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # Maintenance: while the flag file exists every request gets the maintenance page (503), nothing reaches the door or a place.
    # On: touch /var/www/bridgeai-maintenance/on. Off: rm it. The page lives next to it (index.html, this repo's maintenance/).
    error_page 503 @maintenance;
    if (-f /var/www/bridgeai-maintenance/on) { return 503; }

    location = /_door { return 302 /_door/; }
    location /_door/ {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }
    location = /_door_auth {
        internal;
        proxy_pass http://127.0.0.1:8095/_door/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }
    location / {
        auth_request /_door_auth;
        auth_request_set $door_up $upstream_http_x_door_upstream;
        auth_request_set $door_auth $upstream_http_x_door_auth;
        error_page 401 = @login;
        error_page 403 = @state;
        proxy_pass https://$door_up;
        proxy_ssl_verify off;                      # the place's own certificate is self-signed; the hop is the LAN
        proxy_set_header Authorization $door_auth;
        proxy_set_header Cookie "";                # the door's cookie stays here
        proxy_set_header Host $door_up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $door_conn;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location @maintenance {
        root /var/www/bridgeai-maintenance;
        default_type text/html;
        add_header Retry-After 300 always;
        add_header Cache-Control "no-store" always;
        try_files /index.html =503;
    }
    location @login {
        default_type text/html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 200 '<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="design-guide" content="guia-sitios@a787438 frontend-design 2026-11-28"><title>Bienvenido</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1c2233;color:#ece8de;font:17px/1.5 Ubuntu,Cantarell,"Segoe UI Variable","Segoe UI",system-ui,sans-serif}main{background:#262d42;border-radius:14px;padding:2rem;max-width:30rem;margin:1rem}p{margin:.3rem 0}h1{display:flex;align-items:center;gap:.65rem;font-size:1.5rem;font-weight:500;margin:0 0 .4rem}h1::before{content:"";flex:0 0 1.05rem;height:1.05rem;border-radius:50%;background:#f0b44c}p{color:#9aa4b8}</style></head><body><main><h1>Bienvenido</h1><p lang="ru">Добро пожаловать</p><p lang="en">Welcome</p></main></body></html>';
    }
    location @state { return 302 /_door/; }
}
